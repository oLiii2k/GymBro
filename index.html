<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GymBro</title>
<link rel="stylesheet" href="tokens.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
       background:var(--bg);color:var(--fg);line-height:1.45;
       display:flex;justify-content:center;padding:20px 12px 40px;min-height:100vh}
  .phone{width:392px;background:var(--surface);border:1px solid var(--line);
         border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
  .themebtn{position:fixed;top:12px;right:16px;z-index:9;background:var(--surface);color:var(--fg);
    border:1px solid var(--line-strong);border-radius:var(--r-sm);height:34px;padding:0 12px;
    font-size:13px;font-weight:600;cursor:pointer}

  header{padding:var(--s-4) var(--s-4) var(--s-3);border-bottom:1px solid var(--line)}
  header h1{font:var(--t-title);letter-spacing:-.01em}
  header .sub{font:var(--t-meta);color:var(--fg-muted);margin-top:var(--s-1)}
  .bar{margin-top:var(--s-3);height:5px;border-radius:3px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;width:33%;background:var(--ok);transition:width var(--dur-med) var(--ease)}

  /* ---------- Scan-Ebene ---------- */
  .row{border-bottom:1px solid var(--line);padding:var(--s-3) var(--s-4)}
  .row.open{background:var(--surface-2)}
  .head{display:grid;grid-template-columns:1fr auto var(--slot-flag);gap:var(--s-3);
        align-items:center;min-height:var(--hit-row);cursor:pointer}
  .rname{font:var(--t-item)}
  .rmeta{font:var(--t-meta);color:var(--fg-muted);margin-top:2px}
  .rload{font:var(--t-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .rload small{display:block;font-size:10.5px;font-weight:600;color:var(--fg-muted);letter-spacing:.04em}
  .fslot{width:var(--slot-flag);height:var(--slot-flag)}         /* Post-MVP: Gelenk-Flag */
  .flag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:999px;margin-left:6px;vertical-align:1px}
  .flag.hold{background:var(--warn-bg);color:var(--warn)}
  .flag.up{background:var(--ok-bg);color:var(--ok)}
  .tick{font:var(--t-meta);font-weight:700;color:var(--ok);margin-top:3px;font-variant-numeric:tabular-nums}

  .detail{display:none;padding-top:var(--s-3)}
  .row.open .detail{display:block}

  /* ---------- Bewegung: statische Zeichnung + Tempo ---------- */
  .demo{display:grid;grid-template-columns:104px 1fr;gap:var(--s-3);align-items:center;
        background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
        padding:var(--s-2);margin-bottom:var(--s-3)}
  .stage{width:88px;height:88px;border-radius:var(--r-sm);background:var(--surface-2);display:block;cursor:zoom-in}
  .demo .txt{font:var(--t-meta);color:var(--fg-muted)}
  .demo .txt b{display:block;color:var(--fg);font-size:13px;font-weight:700;margin-bottom:2px}
  .demo .ctrl{margin-top:var(--s-2)}
  .demo .ctrl a{display:inline-flex;align-items:center;height:32px;padding:0 10px;border-radius:var(--r-sm);
       border:1px solid var(--line-strong);color:var(--accent);font-size:12px;font-weight:700;text-decoration:none}
  svg .fig{stroke:var(--figure);stroke-width:5;stroke-linecap:round;fill:none}
  svg .body{stroke:var(--figure-body);stroke-width:5;stroke-linecap:round;fill:none}
  svg .wt{fill:var(--figure)}
  .big{position:fixed;inset:0;background:rgba(5,8,11,.86);display:none;place-items:center;z-index:20}
  .big.on{display:grid}
  .big svg{width:min(78vw,340px);height:auto;background:var(--surface);border-radius:18px;padding:12px}

  h4{font:var(--t-label);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-muted);
     margin:var(--s-4) 0 var(--s-2)}
  h4 em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:600}
  ol.hints{list-style:none;counter-reset:h}
  ol.hints li{counter-increment:h;position:relative;padding-left:24px;font:var(--t-body);margin-bottom:6px}
  ol.hints li::before{content:counter(h);position:absolute;left:0;top:2px;width:17px;height:17px;border-radius:50%;
    background:var(--surface-2);border:1px solid var(--line-strong);color:var(--fg-muted);
    font-size:10.5px;font-weight:700;display:grid;place-items:center}

  /* ---------- Satz-Eingabe ---------- */
  .setrow{display:grid;grid-template-columns:22px 1fr 1fr var(--hit-min);
          gap:var(--hit-gap);align-items:center;margin-bottom:var(--s-2)}
  .setno{font:var(--t-meta);font-weight:700;color:var(--fg-muted);text-align:center}
  .field{display:flex;align-items:center;border:1px solid var(--line-strong);border-radius:var(--r-sm);
         background:var(--surface);height:var(--hit-min);overflow:hidden}
  .field button{width:36px;height:100%;background:none;border:none;color:var(--fg-muted);
                font-size:19px;cursor:pointer;flex:none}
  .field button:active{background:var(--surface-2);color:var(--fg)}
  .field .val{flex:1;text-align:right;font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;
              transition:color var(--dur-fast) var(--ease)}
  .field .unit{font-size:11px;color:var(--fg-muted);font-weight:600;padding:0 6px 0 4px}
  .field.devmark{border-color:var(--warn)}
  .field.devmark .val{color:var(--warn)}
  .done{width:var(--hit-min);height:var(--hit-min);border-radius:var(--r-sm);border:1px solid var(--line-strong);
        background:var(--surface);color:var(--fg-muted);font-size:18px;cursor:pointer;
        transition:background var(--dur-fast) var(--ease)}
  .setrow.ok .done{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
  .hintline{font:var(--t-meta);color:var(--fg-muted);margin-top:var(--s-1)}
  .hintline b{color:var(--fg)}
  .allbtn{width:100%;min-height:var(--hit-min);margin-top:var(--s-2);border-radius:var(--r-md);
    border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:15px;font-weight:700;cursor:pointer}
  .note{margin-top:var(--s-3);font:var(--t-meta);color:var(--warn);background:var(--warn-bg);
        border-radius:var(--r-sm);padding:var(--s-2) var(--s-3)}
  .logline{margin-top:var(--s-3);font-family:ui-monospace,Consolas,monospace;font-size:11.5px;
    color:var(--fg-muted);background:var(--surface);border:1px dashed var(--line-strong);
    border-radius:var(--r-sm);padding:var(--s-2) var(--s-3);word-break:break-word}

  .foot{margin-top:auto;border-top:1px solid var(--line);padding:var(--s-3) var(--s-4) var(--s-4)}
  .sum{display:flex;justify-content:space-between;font:var(--t-meta);color:var(--fg-muted)}
  .sum b{color:var(--fg);font-size:15px;font-variant-numeric:tabular-nums}
  .save{margin-top:var(--s-3);width:100%;height:50px;border:none;border-radius:var(--r-md);
        background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:700;cursor:pointer}

  /* ---------- Login / Status ---------- */
  .login{padding:var(--s-5) var(--s-4);display:flex;flex-direction:column;gap:var(--s-3)}
  .login h1{font:var(--t-title)}
  .login p{font:var(--t-meta);color:var(--fg-muted)}
  .login input{height:var(--hit-min);border:1px solid var(--line-strong);border-radius:var(--r-sm);
    background:var(--surface-2);color:var(--fg);font-size:16px;padding:0 var(--s-3)}
  .login .save{margin-top:0}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:92vw;z-index:30;
    background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:var(--r-sm);
    padding:var(--s-2) var(--s-3);font:var(--t-meta);display:none}
  .toast.on{display:block}
  .tick.pending,.tick.last{color:var(--fg-muted);font-weight:400}
  .linkbtn{background:none;border:none;color:var(--fg-muted);font-size:12px;text-decoration:underline;cursor:pointer;margin-top:var(--s-2)}
</style>
</head>
<body>
<button class="themebtn" id="t">☀ Hell</button>
<div class="toast" id="toast" role="status"></div>
<div class="phone" id="app"></div>
<div class="big" id="big" onclick="this.classList.remove('on')"><svg viewBox="0 0 104 104" id="bigsvg"></svg></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="plan.js"></script>
<script src="app.js"></script>
</body>
</html>
